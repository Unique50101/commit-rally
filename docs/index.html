<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Commit Rally · Time trial</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1415;color:#f0f6eb;font:16px system-ui,sans-serif}main{max-width:920px;margin:5vh auto;padding:20px}header,.panel,.buttons{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{margin-bottom:22px}h1{font-size:clamp(32px,6vw,60px);letter-spacing:-.065em;margin:0}small{color:#a9beb3}#clock{font: bold 26px ui-monospace,monospace;color:#c4ff45}svg{width:100%;display:block;background:#102523;border:1px solid #475e55;border-radius:14px}.panel{margin:18px 0}.buttons{justify-content:flex-start}button{padding:14px 18px;background:#22312f;color:#e6efe7;border:1px solid #496059;border-radius:8px;font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #65dbff}button.primary{background:#c4ff45;color:#102018;font-weight:700}button:disabled{opacity:.5}button[aria-pressed=true]{background:#4c6456;border-color:#c4ff45}p{color:#c4d6ca;line-height:1.5}#url{width:100%;padding:8px}footer{margin-top:20px;color:#9bb3a6;font-size:14px}
</style><main><header><div><small id="course">Circuit</small><h1>Commit Rally</h1></div><output id="clock">0.00 s</output></header><svg viewBox="0 0 800 414" role="img" aria-label="Rally circuit, lime player car and cyan replay car"><g id="base"></g><g id="cars"></g></svg><div class="panel"><div class="buttons"><button class="primary" id="start">Start lap</button><button id="share" disabled>Share fastest lap</button></div><span id="score">0 / 12 boosts</span></div><p id="status" role="status">Choose a lane to hit the lime arrows and gain speed.</p><div class="buttons" id="lanes"><button data-lane="-1">Outer · ←</button><button data-lane="0">Middle · ↓</button><button data-lane="1">Inner · →</button></div><p>Auto-throttle is on. Use the arrow keys or tap a lane. The cyan car replays the lap you’re chasing.</p><input id="url" aria-label="Challenge link" hidden readonly><footer>Commit Rally by Unique50101</footer></main><script type="module" src="./game.mjs"></script></html>
